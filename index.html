<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ozichat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --safe-area-top: env(safe-area-inset-top, 0px);
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --safe-area-left: env(safe-area-inset-left, 0px);
        --safe-area-right: env(safe-area-inset-right, 0px);
      }
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0B0E14;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        position: fixed;
        width: 100%;
      }
      body {
        font-family: 'Poppins', sans-serif;
      }
      input, textarea, [contenteditable] {
        -webkit-user-select: text;
        user-select: text;
      }
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background-color: transparent;
      }
      /* Direct child of #root fills viewport, gradients extend under safe areas.
         Only TOP padding applied here — bottom-area components (BottomNavBar)
         handle their own safe-area-bottom so the nav reaches the home indicator. */
      #root > * {
        min-height: 100%;
        padding-top: var(--safe-area-top);
        padding-left: var(--safe-area-left);
        padding-right: var(--safe-area-right);
        box-sizing: border-box;
        transition: padding-bottom 0.2s ease;
      }
      body.keyboard-open #root > * {
        padding-bottom: var(--keyboard-height, 0px);
      }
      /* For auth screens without a bottom nav — they get safe-area padding too */
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
    </style>
